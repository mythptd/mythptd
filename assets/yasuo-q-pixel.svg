<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-labelledby="title desc">
  <title id="title">Yasuo Steel Tempest pixel animation</title>
  <desc id="desc">Pixel-art Yasuo with a long ponytail and blue scarf thrusts twice, then sends a spinning Q3 wind tornado through three armored minions.</desc>
  <defs>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="1" height="1" fill="#5b554b" opacity=".22" />
      <rect x="5" y="3" width="1" height="1" fill="#f3eee1" opacity=".32" />
      <rect x="3" y="7" width="1" height="1" fill="#756d60" opacity=".16" />
    </pattern>
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#514b42" opacity=".12" />
    </pattern>
  </defs>

  <!-- Warm, softly dithered pixel-art backdrop inspired by the reference GIF. -->
  <rect width="880" height="260" fill="#b9b5a8" />
  <rect width="880" height="260" fill="url(#grain)" />
  <rect width="880" height="260" fill="url(#scan)" />
  <path d="M0 220H880" stroke="#3c332d" stroke-width="4" />
  <path d="M0 226H880" stroke="#786f62" stroke-width="2" />

  <!-- Small ground pixels move beneath the fighters. -->
  <g fill="#564d42" opacity=".7">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-88 0" dur=".42s" repeatCount="indefinite" />
      <rect x="18" y="235" width="22" height="4" />
      <rect x="104" y="244" width="12" height="4" />
      <rect x="190" y="235" width="24" height="4" />
      <rect x="290" y="244" width="16" height="4" />
      <rect x="385" y="235" width="20" height="4" />
      <rect x="480" y="244" width="14" height="4" />
      <rect x="572" y="235" width="24" height="4" />
      <rect x="670" y="244" width="16" height="4" />
      <rect x="764" y="235" width="20" height="4" />
      <rect x="850" y="244" width="12" height="4" />
    </g>
  </g>

  <!-- Yasuo: layered ponytail, face, blue scarf, armor and indigo hakama. -->
  <g transform="translate(136 73)" shape-rendering="crispEdges">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;13 0;0 0;0 0;13 0;0 0;0 0" keyTimes="0;.035;.055;.09;.245;.265;.30;1" dur="7s" repeatCount="indefinite" />

      <!-- Long, wind-swept hair -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-3 -2;0 0;2 1;0 0" dur=".8s" repeatCount="indefinite" />
        <path d="M57 17H39V8H18V3H-5V8H-28V13H-53V20H-77V28H-60V34H-42V40H-21V46H1V42H24V37H42V31H56V24H65Z" fill="#2a1913" stroke="#211510" stroke-width="4" stroke-linejoin="miter" />
        <path d="M-63 20H-43V25H-25V31H-7V36H12V40H-9V36H-29V31H-47V26H-64Z" fill="#57321e" />
        <path d="M-39 14H-20V19H-2V24H17V30H34V34H18V29H0V24H-19V19H-38Z" fill="#412419" />
        <rect x="42" y="14" width="12" height="8" fill="#b9332b" />
        <rect x="45" y="12" width="6" height="12" fill="#e65b43" />
      </g>

      <!-- Back of head, hairline and face -->
      <path d="M47 13H69V18H79V27H84V38H78V47H69V54H51V47H44V39H39V25H45V18H47Z" fill="#e7b98d" stroke="#30201a" stroke-width="4" stroke-linejoin="miter" />
      <path d="M43 17H53V8H72V12H82V20H76V17H65V24H57V21H48V34H42Z" fill="#261913" />
      <rect x="66" y="27" width="5" height="5" fill="#251713" />
      <rect x="76" y="35" width="7" height="4" fill="#b7775d" />
      <rect x="45" y="30" width="7" height="11" fill="#cc936f" />
      <rect x="51" y="50" width="20" height="13" fill="#c88c68" />

      <!-- Neck wrap and flowing blue scarf -->
      <path d="M43 50H63V57H78V64H95V73H83V81H66V76H53V68H40Z" fill="#3f9fc9" stroke="#30201a" stroke-width="4" stroke-linejoin="miter" />
