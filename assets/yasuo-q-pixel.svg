      <path d="M28 108H75V116H29Z" fill="#8d2926" stroke="#30201a" stroke-width="3" />
      <path d="M37 115H48V125H43V141H35V133H30V123H37Z" fill="#b53a30" />
      <path d="M33 115H75V125H69V143H51V134H45V145H24V136H18V123H30Z" fill="#4c2a78" stroke="#30201a" stroke-width="4" stroke-linejoin="miter" />
