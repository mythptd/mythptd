        <path d="M24 39H29V51H23V59H18V53H21V45H24Z" fill="#8f2e29" />
        <path d="M47 39H52V47H56V55H50V50H45Z" fill="#8f2e29" />
        <path d="M28 48H47V53H44V58H29V54H26Z" fill="#c49552" />
        <path d="M28 56H36V67H32V73H21V68H25V58H28Z" fill="#4b4a47" />
        <path d="M41 56H49V66H54V72H39V67H36V61H41Z" fill="#4b4a47" />
