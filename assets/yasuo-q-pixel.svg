      <path d="M20-1H86V0H20Z" fill="#fff4d6" />
    </g>
  </g>

  <!-- Thin pixel slashes on Q1 and Q2. -->
  <g fill="none" stroke-linecap="square">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0;1;0;0" keyTimes="0;.035;.05;.10;.23;.245;.27;.32;1" dur="7s" repeatCount="indefinite" />
      <path d="M304 126H368V130H350M311 119H352" stroke="#e9f8f4" stroke-width="4" />
      <path d="M363 123L377 129L363 135" stroke="#5ac9e0" stroke-width="3" />
    </g>
  </g>

