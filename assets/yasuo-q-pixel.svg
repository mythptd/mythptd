      <path d="M79 65H101V72H112V78H100V86H84V79H76Z" fill="#2988b7" stroke="#30201a" stroke-width="4" stroke-linejoin="miter" />
      <path d="M92 73H106V78H99V83H90Z" fill="#74c9df" />

      <!-- Blue shoulder armor, undershirt and forearms -->
      <path d="M35 61H52V67H70V77H83V99H75V116H33V106H24V83H32V72H38Z" fill="#263c68" stroke="#30201a" stroke-width="4" stroke-linejoin="miter" />
      <path d="M39 65H51V71H65V78H75V87H64V82H50V76H38Z" fill="#3978a6" />
      <path d="M28 72H40V83H51V91H45V101H32V94H23V82H28Z" fill="#5685a7" stroke="#30201a" stroke-width="3" stroke-linejoin="miter" />
      <rect x="57" y="91" width="18" height="8" fill="#e7b98d" />
      <rect x="66" y="95" width="15" height="8" fill="#d69d76" />
      <rect x="69" y="91" width="13" height="5" fill="#35465d" />

