    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.50;.52;.80;.85;1" dur="7s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="translate" values="290 174;290 174;830 174;830 174;290 174" keyTimes="0;.51;.80;.85;1" dur="7s" repeatCount="indefinite" />
    <g shape-rendering="crispEdges">
