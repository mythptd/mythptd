      <path d="M56 120H66V128H61V137H54Z" fill="#342252" />
      <path d="M19 135H43V143H39V151H18V146H13V140H19Z" fill="#25202a" stroke="#30201a" stroke-width="3" />
      <path d="M50 136H70V143H76V148H70V152H49V146H45V141H50Z" fill="#25202a" stroke="#30201a" stroke-width="3" />
      <rect x="17" y="143" width="19" height="3" fill="#c3b8a4" />
      <rect x="53" y="144" width="17" height="3" fill="#c3b8a4" />
