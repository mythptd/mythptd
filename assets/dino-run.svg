<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-labelledby="title desc">
  <title id="title">Offline dinosaur runner</title>
  <desc id="desc">A pixel dinosaur runs and jumps over cactus obstacles in a looping arcade animation.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#475569" stroke-opacity=".18" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="1" y="1" width="878" height="178" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="876" height="176" rx="11" fill="url(#grid)" />

  <text x="28" y="34" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">OFFLINE RUNNER</text>
  <text x="852" y="34" text-anchor="end" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">DINO.exe // READY</text>

  <path d="M24 132H856" stroke="#64748b" stroke-width="2" />

  <g fill="#94a3b8" opacity=".55">
    <rect x="28" y="143" width="24" height="3" rx="1" />
    <rect x="94" y="151" width="12" height="3" rx="1" />
    <rect x="164" y="143" width="30" height="3" rx="1" />
    <rect x="242" y="151" width="14" height="3" rx="1" />
    <rect x="314" y="143" width="26" height="3" rx="1" />
    <rect x="382" y="151" width="14" height="3" rx="1" />
    <rect x="454" y="143" width="30" height="3" rx="1" />
    <rect x="534" y="151" width="12" height="3" rx="1" />
    <rect x="604" y="143" width="25" height="3" rx="1" />
    <rect x="676" y="151" width="14" height="3" rx="1" />
    <rect x="746" y="143" width="28" height="3" rx="1" />
    <rect x="824" y="151" width="13" height="3" rx="1" />
    <animateTransform attributeName="transform" type="translate" values="0 0;-90 0" dur=".42s" repeatCount="indefinite" />
  </g>

  <g fill="#22c55e" shape-rendering="crispEdges">
    <g>
      <g transform="translate(300 0)">
        <rect x="8" y="99" width="12" height="33" />
        <rect x="0" y="108" width="8" height="13" />
        <rect x="20" y="103" width="8" height="12" />
        <rect x="-2" y="108" width="8" height="5" />
        <rect x="22" y="103" width="5" height="5" />
      </g>
      <g transform="translate(600 0)">
        <rect x="9" y="91" width="13" height="41" />
        <rect x="0" y="102" width="9" height="17" />
        <rect x="22" y="108" width="8" height="13" />
        <rect x="-2" y="102" width="5" height="5" />
        <rect x="25" y="108" width="5" height="5" />
      </g>
      <g transform="translate(900 0)">
        <rect x="8" y="101" width="12" height="31" />
        <rect x="0" y="110" width="8" height="12" />
        <rect x="20" y="105" width="8" height="12" />
        <rect x="-2" y="110" width="5" height="5" />
        <rect x="23" y="105" width="5" height="5" />
      </g>
    </g>
    <g transform="translate(900 0)">
      <g transform="translate(300 0)">
        <rect x="8" y="99" width="12" height="33" />
        <rect x="0" y="108" width="8" height="13" />
        <rect x="20" y="103" width="8" height="12" />
        <rect x="-2" y="108" width="5" height="5" />
        <rect x="23" y="103" width="5" height="5" />
      </g>
      <g transform="translate(600 0)">
        <rect x="9" y="91" width="13" height="41" />
        <rect x="0" y="102" width="9" height="17" />
        <rect x="22" y="108" width="8" height="13" />
        <rect x="-2" y="102" width="5" height="5" />
        <rect x="25" y="108" width="5" height="5" />
      </g>
      <g transform="translate(900 0)">
        <rect x="8" y="101" width="12" height="31" />
        <rect x="0" y="110" width="8" height="12" />
        <rect x="20" y="105" width="8" height="12" />
        <rect x="-2" y="110" width="5" height="5" />
        <rect x="23" y="105" width="5" height="5" />
      </g>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="4.8s" repeatCount="indefinite" />
  </g>

  <g fill="#a78bfa" shape-rendering="crispEdges">
    <g transform="translate(105 60)">
      <animateTransform attributeName="transform" type="translate" values="105 60;105 60;105 31;105 31;105 60;105 60" keyTimes="0;.40;.48;.58;.68;1" dur="1.6s" repeatCount="indefinite" />
      <rect x="38" y="0" width="34" height="20" />
      <rect x="31" y="17" width="31" height="23" />
      <rect x="5" y="31" width="43" height="25" />
      <rect x="-12" y="37" width="18" height="8" />
      <rect x="41" y="26" width="17" height="6" fill="#8b5cf6" />
      <rect x="66" y="7" width="5" height="5" fill="#0b1220" />
      <rect x="62" y="14" width="14" height="3" fill="#22d3ee" />
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0;-3 2;0 0" dur=".32s" repeatCount="indefinite" />
        <rect x="10" y="52" width="9" height="13" />
        <rect x="6" y="63" width="15" height="5" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-3 2;0 0;3 -2;0 0" dur=".32s" repeatCount="indefinite" />
        <rect x="31" y="52" width="9" height="13" />
        <rect x="29" y="63" width="15" height="5" />
      </g>
      <rect x="18" y="23" width="11" height="5" fill="#06b6d4" />
    </g>
  </g>
</svg>
